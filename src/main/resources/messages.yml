# ══════════════════════════════════════════
# ExtraNPC Messages (MiniMessage)
# Prefix is applied from config.yml
# Clickable help uses <click> / <hover> tags
# ══════════════════════════════════════════

# ── General ───────────────────────────────
no-permission: "<red>No permission.</red>"
player-only: "<red>Players only.</red>"
unknown-command: "<red>Unknown command.</red> <gray>Try </gray><click:run_command:'/extranpc help'><hover:show_text:'<gray>Open help</gray>'><aqua>/extranpc help</aqua></click>"
reload: "<green>Reloaded successfully.</green>"
saved: "<green>Saved.</green>"
cancelled: "<yellow>Cancelled.</yellow>"

# ── NPC ───────────────────────────────────
npc-created: "<green>Created</green> <yellow>{id}</yellow>"
npc-deleted: "<red>Deleted</red> <yellow>{id}</yellow>"
npc-not-found: "<red>NPC not found:</red> <yellow>{id}</yellow>"
npc-exists: "<red>Already exists:</red> <yellow>{id}</yellow>"
npc-moved: "<green>Moved</green> <yellow>{id}</yellow> <gray>to you</gray>"
npc-selected: "<green>Selected</green> <yellow>{id}</yellow>"
npc-teleported: "<green>Teleported to</green> <yellow>{id}</yellow>"
invalid-type: "<red>Invalid NPC type.</red>"
list-header: "<aqua><bold>NPCs</bold></aqua> <dark_gray>(</dark_gray><white>{count}</white><dark_gray>)</dark_gray>"
list-entry: "<dark_gray>•</dark_gray> <click:run_command:'/extranpc edit {id}'><hover:show_text:'<gray>Click to edit</gray>'><yellow>{id}</yellow></click> <dark_gray>|</dark_gray> {name} <dark_gray>|</dark_gray> <white>{type}</white>"

# ── Input ─────────────────────────────────
input-cancel: "<dark_gray>Type </dark_gray><yellow>cancel</yellow><dark_gray> to abort</dark_gray>"
input-name: "<green>Enter display name:</green>"
input-skin-name: "<green>Enter player name for skin:</green>"
input-skin-url: "<green>Enter skin texture URL:</green>"
input-command: "<green>Enter command</green> <dark_gray>(no /)</dark_gray><green> · use</green> <yellow>{player}</yellow>"
input-permission: "<green>Enter permission</green> <dark_gray>or</dark_gray> <yellow>none</yellow><green>:</green>"
input-id: "<green>Enter unique NPC id:</green>"

# ── Shop / Interact ───────────────────────
shop-empty: "<red>No trades yet.</red> <gray>Add recipes in the shop editor.</gray>"
shop-enabled: "<green>Shop enabled.</green> <gray>Players can trade on right-click.</gray>"
shop-disabled: "<red>Shop disabled.</red> <gray>Right-click will not open the shop.</gray>"
cooldown: "<red>Wait</red> <yellow>{seconds}s</yellow>"
no-interact-perm: "<red>You can't use this NPC.</red>"
citizens-required: "<red>Player NPC engine error.</red>"
npc-engine-error: "<red>Player NPC engine failed to start.</red> <gray>Check console.</gray>"

