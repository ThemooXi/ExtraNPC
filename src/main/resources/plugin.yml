name: ExtraNPC
version: '${version}'
main: me.themoo.extranpc.ExtraNPCPlugin
api-version: '1.19'
authors: [ ThemoO ]
description: Standalone NPC framework for Paper 1.19.4 through 26.x with native Mannequin support, GUI and shops.
website: https://discord.com/invite/fJTSA6vnVQ
softdepend: [ PlaceholderAPI ]
commands:
  extranpc:
    description: Main ExtraNPC command
    aliases: [ enpc, npc ]
    permission: extranpc.admin
    usage: /extranpc <help|about|update|gui|create|edit|delete|list|move|tp|here|select|reload>
permissions:
  extranpc.admin:
    description: Full access to ExtraNPC
    default: op
  extranpc.use:
    description: Interact with NPCs
    default: true
  extranpc.bypass:
    description: Bypass NPC interaction permissions and cooldowns
    default: op
